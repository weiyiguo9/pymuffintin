[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymuffintin"
version = "0.1.0"
description = "Application layer and Python interface for libmuffintin"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "weiyiguo9"}]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opt_einsum",
    "sparse-ir>=2.1.2",
    "spglib>=2.7",
    "spgrep>=0.7",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
nufft = ["finufft>=2.5.1"]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
